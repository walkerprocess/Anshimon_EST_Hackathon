spring:
  application:
    name: ansimon-backend
  jackson:
    time-zone: Asia/Seoul
  ai:
    vectorstore:
      type: ${SPRING_AI_VECTORSTORE_TYPE:none}
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info

ansimon:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  web-client:
    connection-timeout: ${WEBCLIENT_CONNECTION_TIMEOUT:2s}
    response-timeout: ${WEBCLIENT_RESPONSE_TIMEOUT:5s}
