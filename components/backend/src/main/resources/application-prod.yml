spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000
      keepalive-time: 30000
      idle-timeout: 60000
      max-lifetime: 120000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

ansimon:
  external:
    kma:
      base-url: ${KMA_BASE_URL}
      api-key: ${KMA_API_KEY}
    shelter:
      base-url: ${SHELTER_BASE_URL}
      api-key: ${SHELTER_API_KEY}
    tmap:
      base-url: ${TMAP_BASE_URL}
      api-key: ${TMAP_API_KEY}
    ml:
      base-url: ${ML_API_BASE_URL}
    phone:
      base-url: ${PHONE_API_BASE_URL}
    connection:
      base-url: ${CONNECTION_BASE_URL}
      api-key: ${CONNECTION_API_KEY:}
  connection:
    web-client:
      connection-timeout: ${CONNECTION_WEBCLIENT_CONNECTION_TIMEOUT:2s}
      response-timeout: ${CONNECTION_WEBCLIENT_RESPONSE_TIMEOUT:120s}
