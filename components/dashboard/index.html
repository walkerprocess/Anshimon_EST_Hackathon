<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>안심온 · 통합 대시보드</title>

    <!-- 한글: 에스코어 드림 (S-Core Dream, 100–900) -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/gh/fonts-archive/S-CoreDream/S-CoreDream.css"
    />
    <!-- 데이터·시각·식별자 전용: DM Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap"
    />

    <style>
      /* ═══════════════════════════════════════════════════════════════
   안심온 — 폭염 예방 돌봄 콘솔
   ───────────────────────────────────────────────────────────────
   색 규칙 (이 페이지의 유일한 규칙):
     차가운 남색 = 시스템·계획·평상.
     따뜻한 색   = 온도, 그리고 온도 때문에 위험한 사람. 그 외엔 절대 쓰지 않는다.
   덕분에 화면에서 따뜻한 픽셀을 찾으면 그게 곧 오늘의 일이다.
   ═══════════════════════════════════════════════════════════════ */
      :root {
        --ice: #eef3fa;
        --paper: #ffffff;
        --deep: #0b1a38;
        --navy: #2f5ac4;
        --navy-ink: #1b3a86;
        --navy-100: #e3eafa;
        --navy-200: #c6d5f4;
        --navy-300: #9bb4e8;
        --teal: #12907b;
        --teal-dk: #17a088;
        --heat: #d2701f;
        --heat-hi: #b62318;
        --heat-dk: #d07f31;

        --ink-1: #0b1a38;
        --ink-2: #41537a;
        --ink-3: #71809e;
        --ink-4: #9aa6be;
        --rule: rgba(36, 67, 62, 0.16);
        --rule-2: rgba(36, 67, 62, 0.09);

        --glass-light: rgba(245, 250, 247, 0.7);
        --glass-nav: rgba(250, 253, 251, 0.74);
        --glass-edge: rgba(255, 255, 255, 0.66);

        --kr: "S-Core Dream", -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        --mono: "DM Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas,
          monospace;

        --r-xl: 30px;
        --r-lg: 22px;
        --r-md: 14px;
        --r-sm: 9px;
        --lift: 0 1px 1px rgba(7, 24, 20, 0.08),
          0 18px 46px -22px rgba(5, 20, 15, 0.45);
        --glass-lift: 0 24px 70px -34px rgba(4, 19, 14, 0.58),
          inset 0 1px 0 rgba(255, 255, 255, 0.48);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--kr);
        font-weight: 400;
        font-size: 14px;
        line-height: 1.55;
        color: var(--ink-1);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        background-color: #506550;
        background-image: linear-gradient(
            125deg,
            rgba(4, 17, 13, 0.48),
            rgba(24, 47, 29, 0.14) 46%,
            rgba(5, 20, 16, 0.42)
          ),
          url("./background.png");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }
      h1,
      h2,
      h3,
      p,
      figure,
      dl,
      dd {
        margin: 0;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--navy);
        outline-offset: 3px;
        border-radius: 4px;
      }
      [hidden] {
        display: none !important;
      }

      /* 유틸 타입 — 데이터와 라벨만 mono 를 입는다 */
      .mono {
        font-family: var(--mono);
        font-feature-settings: "tnum" 1;
      }
      .eyebrow {
        font-family: var(--mono);
        font-size: 10.5px;
        font-weight: 400;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .shell {
        max-width: 1520px;
        margin: 0 auto;
        padding: 20px 26px 44px;
      }

      /* ─── 네비게이션: 떠 있는 알약 ─── */
      .nav {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 26px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--paper);
        border-radius: 999px;
        padding: 9px 20px 9px 11px;
        box-shadow: var(--lift);
      }
      .logo .m {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #eaf9ff;
        color: #fff;
        display: block;
        flex: none;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(74, 186, 232, 0.42);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.62);
      }
      .logo .m img {
        position: absolute;
        width: 98px;
        max-width: none;
        left: -12px;
        top: -13px;
      }
      .logo b {
        font-weight: 600;
        font-size: 15px;
        letter-spacing: -0.01em;
      }
      .tabs {
        display: flex;
        gap: 2px;
        background: var(--paper);
        border-radius: 999px;
        padding: 5px;
        box-shadow: var(--lift);
        margin: 0 auto;
      }
      .tabs button,
      .tabs a {
        padding: 8px 20px;
        border-radius: 999px;
        font-size: 13.5px;
        font-weight: 400;
        color: var(--ink-2);
        transition: background 0.18s, color 0.18s;
        display: inline-block;
        text-decoration: none;
      }
      .tabs button:hover,
      .tabs a:hover {
        background: var(--navy-100);
        color: var(--navy-ink);
      }
      .tabs button[aria-current="page"],
      .tabs a[aria-current="page"] {
        background: var(--navy);
        color: #fff;
        font-weight: 500;
      }
      .nav-end {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .round {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: var(--paper);
        display: grid;
        place-items: center;
        color: var(--ink-2);
        box-shadow: var(--lift);
        position: relative;
        transition: color 0.18s;
      }
      .round:hover {
        color: var(--navy);
      }
      .round.alert::after {
        content: "";
        position: absolute;
        top: 9px;
        right: 10px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--heat-hi);
        border: 2px solid var(--paper);
      }
      .who {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--glass-nav);
        border-radius: 999px;
        padding: 5px 18px 5px 5px;
        box-shadow: var(--lift);
      }
      .who .av {
        width: 30px;
        height: 30px;
        border-radius: 999px;
        background: var(--navy-100);
        color: var(--navy-ink);
        display: grid;
        place-items: center;
        font-size: 11.5px;
        font-weight: 600;
        flex: none;
      }
      .who b {
        font-size: 13px;
        font-weight: 500;
        display: block;
        line-height: 1.25;
      }
      .who span {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-3);
        letter-spacing: 0.04em;
      }
      .logo,
      .tabs,
      .round,
      .who {
        background: var(--glass-nav);
        border: 1px solid var(--glass-edge);
        -webkit-backdrop-filter: blur(18px) saturate(135%);
        backdrop-filter: blur(18px) saturate(135%);
      }

      /* ─── 그리드 ─── */
      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 16px;
      }
      .c7 {
        grid-column: span 12;
      }
      .c5 {
        grid-column: span 5;
      }
      .c8 {
        grid-column: span 12;
      }
      .c4 {
        grid-column: span 4;
      }
      .card {
        background: rgba(245, 250, 247, 0.7);
        background-image: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.3),
          rgba(221, 239, 226, 0.06)
        );
        border: 1px solid var(--glass-edge);
        border-radius: var(--r-xl);
        padding: 26px 28px;
        box-shadow: var(--glass-lift);
        display: flex;
        flex-direction: column;
        -webkit-backdrop-filter: blur(22px) saturate(135%);
        backdrop-filter: blur(22px) saturate(135%);
      }
      .head {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        margin-bottom: 20px;
      }
      .head h2 {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .head p {
        font-size: 12.5px;
        color: var(--ink-3);
        font-weight: 300;
        margin-top: 4px;
      }
      .head .end {
        margin-left: auto;
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .head .end select {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.02em;
        color: var(--ink-2);
        border: 1px solid var(--rule);
        border-radius: 999px;
        padding: 6px 10px;
        background: rgba(255, 255, 255, 0.6);
      }
      .pill-btn {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--ink-2);
        border: 1px solid var(--rule);
        border-radius: 999px;
        padding: 6px 13px;
        transition: all 0.16s;
        white-space: nowrap;
      }
      .pill-btn:hover {
        border-color: var(--navy-200);
        color: var(--navy-ink);
        background: var(--navy-100);
      }
      .pill-btn.solid {
        background: var(--navy);
        border-color: var(--navy);
        color: #fff;
      }
      .pill-btn.solid:hover {
        background: var(--navy-ink);
        border-color: var(--navy-ink);
        color: #fff;
      }
      .pill-btn:disabled {
        opacity: 0.48;
        cursor: wait;
        transform: none;
      }
      .call-btn {
        display: inline-grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 999px;
      }
      .call-btn svg {
        display: block;
      }

      /* ─── 1차 대시보드: 어르신 목록 ─── */
      .elder-list {
        display: grid;
        gap: 2px;
      }
      .elder-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 12px;
        padding: 13px 4px;
        border-top: 1px solid var(--rule-2);
        border-radius: var(--r-md);
        transition: background 0.16s;
      }
      .elder-row:first-child {
        border-top: 0;
        padding-top: 4px;
      }
      .elder-row:hover {
        background: rgba(255, 255, 255, 0.26);
      }
      .elder-name {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        grid-template-rows: auto auto;
        column-gap: 13px;
        align-items: center;
        min-width: 0;
        text-align: left;
        border-radius: 12px;
        padding: 4px;
        color: inherit;
        text-decoration: none;
      }
      .elder-name .elder-av {
        grid-row: 1 / span 2;
      }
      .elder-name b {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .elder-name > span:not(.elder-av) {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--ink-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .elder-av {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #e7f7ff, #bdeeff);
        border: 1px solid rgba(47, 90, 196, 0.12);
        color: var(--navy-ink);
        font-weight: 700;
        font-size: 14px;
        box-shadow: inset 0 1px 0 #fff;
      }
      .risk-chip {
        font-family: var(--mono) !important;
        font-size: 9.5px !important;
        letter-spacing: 0.05em;
        padding: 3px 7px;
        border-radius: 999px;
        background: var(--navy-100);
        color: var(--navy-ink) !important;
        white-space: nowrap;
      }
      .risk-chip.critical {
        background: #fbe7e3;
        color: var(--heat-hi) !important;
      }
      .risk-chip.high {
        background: #fceedc;
        color: #a65b18 !important;
      }
      .elder-empty {
        padding: 16px 4px;
        font-size: 12.5px;
        color: var(--ink-3);
      }

      /* ─── 표 ─── */
      .tw {
        overflow-x: auto;
        margin: 0 -28px;
        padding: 0 28px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 920px;
      }
      thead th {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-4);
        font-weight: 400;
        text-align: left;
        padding: 0 14px 12px;
        border-bottom: 1px solid var(--rule);
        white-space: nowrap;
      }
      tbody td {
        padding: 15px 14px;
        border-bottom: 1px solid var(--rule-2);
        vertical-align: top;
        font-size: 13px;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr {
        transition: background 0.14s;
      }
      tbody tr:hover {
        background: rgba(255, 255, 255, 0.34);
      }
      tbody td a {
        color: var(--navy-ink);
        font-weight: 500;
        text-decoration: none;
      }
      tbody td a:hover {
        text-decoration: underline;
      }

      /* ─── 알림 ─── */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        z-index: 120;
        transform: translate(-50%, 18px);
        max-width: min(520px, calc(100vw - 28px));
        padding: 11px 16px;
        border-radius: 999px;
        background: rgba(8, 24, 42, 0.92);
        color: #fff;
        font-size: 12.5px;
        box-shadow: 0 18px 50px -22px rgba(0, 0, 0, 0.8);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s, transform 0.18s;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .toast.error {
        background: #7a2016;
      }

      /* 통화 연결 중 — 실제 전화가 도는 동안 행이 살아 있음을 보여준다 */
      @keyframes ring {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      .elder-row.is-calling {
        background: rgba(18, 144, 123, 0.1);
      }
      .elder-row.is-calling .pill-btn {
        animation: ring 1.1s ease-in-out infinite;
      }

      /* ─── 푸터 ─── */
      .foot {
        display: flex;
        gap: 26px;
        flex-wrap: wrap;
        margin-top: 26px;
        padding: 0 6px;
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.72);
        text-shadow: 0 1px 12px rgba(0, 16, 11, 0.72);
      }
      .foot b {
        color: #fff;
        font-weight: 400;
      }

      /* ─── 로드 시퀀스 ─── */
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(9px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .reveal {
        animation: fade 0.55s cubic-bezier(0.2, 0.75, 0.3, 1) backwards;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      /* ─── 반응형 ─── */
      @media (max-width: 1180px) {
        .c7,
        .c5,
        .c8,
        .c4 {
          grid-column: span 12;
        }
      }
      @media (max-width: 760px) {
        body {
          background-attachment: scroll;
        }
        .shell {
          padding: 14px 14px 32px;
        }
        .nav {
          flex-wrap: wrap;
          gap: 9px;
        }
        .tabs {
          order: 3;
          width: 100%;
          margin: 0;
          overflow-x: auto;
        }
        .tabs button,
        .tabs a {
          padding: 8px 15px;
          font-size: 12.5px;
        }
        .card {
          padding: 22px 18px;
          border-radius: 22px;
        }
        .head {
          flex-wrap: wrap;
        }
        .head .end {
          width: 100%;
          margin-left: 0;
          justify-content: flex-end;
        }
        .tw {
          margin: 0 -18px;
          padding: 0 18px;
        }
        .elder-row {
          gap: 8px;
          padding: 11px 0;
        }
        .elder-name {
          grid-template-columns: 42px minmax(0, 1fr);
          gap: 0 10px;
        }
        .elder-av {
          width: 42px;
          height: 42px;
          border-radius: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav class="nav reveal" style="animation-delay: 0.02s">
        <div class="logo">
          <span class="m mascot" aria-hidden="true">
            <img src="./chr1.png" alt="" />
          </span>
          <b>안심온</b>
        </div>
        <div class="tabs" role="tablist">
          <a href="./index.html" aria-current="page">통합 대시보드</a>
          <a href="./elderly.html">노인 관리</a>
        </div>
      </nav>

      <div class="grid">
        <!-- ══ 1차 대시보드 어르신 목록 ══ -->
        <section class="card c7 reveal" style="animation-delay: 0.08s">
          <div class="head">
            <div>
              <h2>대시보드</h2>
              <p>
                통화 버튼을 누르면 대응계획 생성 · 예방 전화 · 요약이 한 번에
                실행됩니다. 한 건에 최대 2분이 걸립니다.
              </p>
              <p
                class="mono"
                id="risk-source"
                style="font-size: 11.5px; color: var(--ink-3)"
              >
                위험도 불러오는 중…
              </p>
            </div>
          </div>
          <ul class="elder-list" id="elders"></ul>
        </section>

        <!-- ══ 통화 기록 ══ -->
        <section class="card c8 reveal" style="animation-delay: 0.14s">
          <div class="head">
            <div>
              <h2>통화 기록</h2>
              <p>
                답을 듣지 못한 항목은
                <b style="font-weight: 500; color: var(--ink-2)">확인 안 됨</b
                >으로 둡니다. 추측하지 않습니다.
              </p>
            </div>
            <div class="end">
              <select id="obs-status" aria-label="통화 상태 필터">
                <option value="">전체 상태</option>
                <option value="ANSWERED">응답 완료</option>
                <option value="UNCONFIRMED">미응답</option>
                <option value="COMPLETED">완료</option>
                <option value="ACTION_REQUIRED">조치 필요</option>
              </select>
              <button class="pill-btn" id="obs-prev" type="button">이전</button>
              <span
                class="mono"
                id="obs-page"
                style="font-size: 12px; color: var(--ink-3)"
                >—</span
              >
              <button class="pill-btn" id="obs-next" type="button">다음</button>
            </div>
          </div>
          <div class="tw">
            <table>
              <thead>
                <tr>
                  <th style="width: 150px">어르신</th>
                  <th style="width: 112px">상태</th>
                  <th style="width: 96px">종료</th>
                  <th style="width: 300px">확인된 답변</th>
                  <th>요약</th>
                  <th style="width: 104px">확신도</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
      </div>

      <footer class="foot">
        <span><b>안심온</b> · 팀 N.M.D.W.</span>
        <span>통화 첫 문장에서 AI 안내임을 밝힙니다</span>
        <span>녹음하지 않습니다</span>
        <span>전화번호는 화면에 두지 않습니다</span>
        <span id="src">데이터 · —</span>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./assets/api.js"></script>
    <script>
      /* 공통 헬퍼(assets/api.js)의 라벨에 없는 진행 중 상태를 보강합니다. */
      CONTACT_LABEL.CALLING = "통화 연결 중";
      CONTACT_LABEL.RETRY_SCHEDULED = "재통화 예정";

      const ENDPOINTS = {
        elders: "/api/v1/elderly?page=0&size=50&sort=id,desc",
        currentRisk: "/api/v1/risk/current",
        observations: (params) =>
          `/api/v1/contact/observations?${params.toString()}`,
        careRun: (elderlyId) =>
          `/internal/v1/guidance/care-runs/${encodeURIComponent(elderlyId)}`,
      };

      /* care-run 은 전화가 끝날 때까지 동기로 기다립니다.
   백엔드 커넥션 타임아웃이 120초라 클라이언트는 그보다 조금 길게 잡습니다. */
      const CARE_RUN_TIMEOUT_MS = 130000;

      const RISK_LABEL = {
        critical: "긴급",
        high: "높음",
        medium: "보통",
        low: "낮음",
      };

      /* ── 오늘 날짜: 브라우저 시간대가 아니라 서울 기준으로 잡습니다 ── */
      function seoulToday() {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Seoul",
        }).format(new Date());
      }

      /* ── 어르신 목록 ── */
      let ELDER_STATE = [];

      function normalizeElder(raw) {
        return {
          elderlyId: raw.elderlyId ?? raw.id,
          name: raw.displayName ?? raw.name ?? "이름 확인 전",
          age: raw.age ?? "—",
          // ConsentStatus 는 EnumCode 라 JSON 에 소문자로 옵니다.
          consentStatus: String(raw.consentStatus ?? "").toLowerCase() || null,
          contactStatus: String(raw.contactStatus ?? "PENDING").toUpperCase(),
        };
      }

      function renderElders() {
        $("#elders").innerHTML = ELDER_STATE.map((e) => {
          const calling = e.contactStatus === "CALLING";
          const blocked = e.consentStatus && e.consentStatus !== "consented";
          return `<li class="elder-row${calling ? " is-calling" : ""}">
      <a class="elder-name" href="./elderly-detail.html?id=${esc(e.elderlyId)}">
        <span class="elder-av">${esc(avatarText(e.name))}</span>
        <b>${esc(e.name)}</b>
        <span>${esc(e.age ?? "—")}세 · ${esc(
            CONSENT_LABEL[e.consentStatus] || "동의 확인 전"
          )} · ${esc(CONTACT_LABEL[e.contactStatus] || e.contactStatus)}</span>
      </a>
      <span class="risk-chip" data-risk-chip>—</span>
      <button class="pill-btn solid call-btn" type="button" data-action="call" data-id="${esc(
        e.elderlyId
      )}"
              aria-label="${
                calling
                  ? "통화 중"
                  : blocked
                  ? `${esc(CONSENT_LABEL[e.consentStatus])} · 통화 불가`
                  : "자동 통화"
              }"
              title="${
                calling
                  ? "통화 중"
                  : blocked
                  ? `${esc(CONSENT_LABEL[e.consentStatus])} · 통화 불가`
                  : "자동 통화"
              }"
              ${
                calling || blocked ? "disabled" : ""
              }><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
    </li>`;
        }).join("");
        renderRiskChips();
      }

      async function loadElders() {
        const list = $("#elders");
        try {
          const data = await api.get(ENDPOINTS.elders);
          const rows = Array.isArray(data?.content)
            ? data.content
            : Array.isArray(data)
            ? data
            : [];
          ELDER_STATE = rows.map(normalizeElder);
          renderElders();
          if (!ELDER_STATE.length)
            list.innerHTML =
              '<li class="elder-empty">등록된 어르신이 없습니다.</li>';
        } catch (error) {
          list.innerHTML = `<li class="elder-empty">어르신 목록을 불러오지 못했습니다. ${esc(
            error.message
          )}</li>`;
        }
      }

      /* ── 현재 위험도 ──
   지역 단위 예측이라 모든 어르신이 같은 값을 답니다. 그래서 헤더에 출처를 한 번 밝힙니다. */
      let currentRisk = null;
      async function loadRisk() {
        try {
          currentRisk = await api.get(ENDPOINTS.currentRisk);
          const time = (iso) =>
            new Date(iso).toLocaleTimeString("ko-KR", {
              hour: "2-digit",
              minute: "2-digit",
            });
          $("#risk-source").textContent =
            `서울 지역 예측 ${currentRisk.riskScore} · 모델 ${currentRisk.modelVersion}` +
            ` · 피크 ${time(currentRisk.peakStartAt)}~${time(
              currentRisk.peakEndAt
            )}` +
            (currentRisk.stale ? " · 지난 예측입니다" : "");
        } catch (error) {
          currentRisk = null;
          $("#risk-source").textContent = "위험도 예측을 불러오지 못했습니다.";
        }
        renderRiskChips();
      }
      function renderRiskChips() {
        const level = currentRisk
          ? String(currentRisk.riskLevel).toLowerCase()
          : "";
        const label = currentRisk
          ? `${currentRisk.riskScore} ${
              RISK_LABEL[level] || currentRisk.riskLevel
            }`
          : "예측 없음";
        const title = currentRisk
          ? "서울 지역 공통 예측값 · 피크 시간대 주의"
          : "";
        $$("[data-risk-chip]").forEach((chip) => {
          chip.textContent = label;
          chip.title = title;
          chip.className = `risk-chip ${level}`;
          chip.setAttribute("data-risk-chip", "");
        });
      }

      /* ── 통화 기록 ── */
      let obsPage = 0;
      async function loadObservations() {
        const params = new URLSearchParams({
          date: seoulToday(),
          page: String(obsPage),
          size: "20",
        });
        const status = $("#obs-status").value;
        if (status) params.set("status", status);
        const tbody = $("#rows");
        try {
          const data = await api.get(ENDPOINTS.observations(params));
          renderObservations(data);
        } catch (error) {
          tbody.innerHTML = `<tr><td colspan="6">통화 기록을 불러오지 못했습니다. ${esc(
            error.message
          )}</td></tr>`;
          $("#obs-page").textContent = "—";
        }
      }
      function renderObservations(data) {
        const rows = data.content || [];
        $("#obs-page").textContent = data.totalElements
          ? `${data.page + 1} / ${data.totalPages} · 총 ${data.totalElements}건`
          : "오늘 기록 없음";
        $("#obs-prev").disabled = data.page <= 0;
        $("#obs-next").disabled = data.page + 1 >= data.totalPages;
        if (!rows.length) {
          $("#rows").innerHTML =
            '<tr><td colspan="6">오늘 통화 기록이 없습니다.</td></tr>';
          return;
        }
        $("#rows").innerHTML = rows
          .map(
            (o) => `
    <tr>
      <td><a href="./elderly-detail.html?id=${esc(o.elderlyId)}">${esc(
              o.elderlyName
            )}</a></td>
      <td>${esc(CONTACT_LABEL[o.contactStatus] || o.contactStatus)}</td>
      <td class="mono">${new Date(o.endedAt).toLocaleTimeString("ko-KR", {
        hour: "2-digit",
        minute: "2-digit",
      })}</td>
      <td>쉼터 ${esc(TRISTATE_LABEL[o.shelterIntent])} · 단독이동 ${esc(
              TRISTATE_LABEL[o.canMoveAlone]
            )}
          · 도움 ${esc(TRISTATE_LABEL[o.helpNeeded])} · 증상 ${esc(
              TRISTATE_LABEL[o.symptomMentioned]
            )}</td>
      <td>${esc(o.summary || "—")}</td>
      <td class="mono">${
        o.confidence ? Math.round(o.confidence * 100) + "%" : "—"
      }</td>
    </tr>`
          )
          .join("");
      }
      $("#obs-status").addEventListener("change", () => {
        obsPage = 0;
        loadObservations();
      });
      $("#obs-prev").addEventListener("click", () => {
        if (obsPage > 0) {
          obsPage--;
          loadObservations();
        }
      });
      $("#obs-next").addEventListener("click", () => {
        obsPage++;
        loadObservations();
      });

      /* ═══ 안심 돌봄 실행 (care-run) ═══
   POST /internal/v1/guidance/care-runs/{elderlyId} 하나로
   대응계획 생성 → 예방 전화 → 통화 요약이 모두 실행됩니다.
   실제 전화를 걸고 끝날 때까지 기다리므로 한 건에 수십 초가 걸립니다.
   저장은 커넥션 서버가 보내는 결과 콜백이 별도로 처리합니다. */

      const CARE_RUN_ERROR = {
        GLOBAL_CONSENT_REQUIRED: "자동전화에 동의하지 않은 어르신입니다.",
        GLOBAL_GUIDANCE_GENERATION_BLOCKED:
          "RAG 근거 검증에 실패해 대응계획을 만들지 못했습니다.",
        GLOBAL_RESOURCE_NOT_FOUND:
          "어르신 정보 또는 위험도 예측이 없습니다. 먼저 ML 위험도를 예측하세요.",
        GLOBAL_EXTERNAL_SERVICE_TIMEOUT:
          "통화가 제한 시간 안에 끝나지 않았습니다.",
        GLOBAL_EXTERNAL_SERVICE_CLIENT_ERROR:
          "커넥션 서버가 요청을 거부했습니다.",
        GLOBAL_EXTERNAL_SERVICE_SERVER_ERROR:
          "커넥션 서버에 연결할 수 없습니다.",
      };

      async function postCareRun(elderlyId) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), CARE_RUN_TIMEOUT_MS);
        try {
          const response = await fetch(
            API_BASE + ENDPOINTS.careRun(elderlyId),
            {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
              },
              signal: controller.signal,
            }
          );
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.success === false) {
            const code = payload.error?.code;
            const error = new Error(
              CARE_RUN_ERROR[code] ||
                payload.error?.message ||
                `HTTP ${response.status}`
            );
            error.code = code;
            error.status = response.status;
            throw error;
          }
          return payload.data ?? payload;
        } catch (error) {
          if (error.name === "AbortError")
            throw new Error("통화가 응답하지 않아 요청을 중단했습니다.");
          if (error instanceof TypeError)
            throw new Error("백엔드에 연결할 수 없습니다.");
          throw error;
        } finally {
          clearTimeout(timer);
        }
      }

      async function startCall(elderId) {
        const e = ELDER_STATE.find(
          (x) => String(x.elderlyId) === String(elderId)
        );
        if (!e) {
          notify("어르신 정보를 찾을 수 없습니다.", { error: true });
          return;
        }
        if (e.contactStatus === "CALLING") {
          notify("이미 통화를 실행하고 있습니다.");
          return;
        }
        if (e.consentStatus && e.consentStatus !== "consented") {
          notify(
            `${e.name} 어르신은 ${
              CONSENT_LABEL[e.consentStatus]
            } 상태라 자동 통화를 걸 수 없습니다.`,
            { error: true }
          );
          return;
        }

        const previous = e.contactStatus;
        e.contactStatus = "CALLING";
        renderElders();
        try {
          const result = await postCareRun(e.elderlyId);
          e.contactStatus = result.answered ? "ANSWERED" : "UNCONFIRMED";
          notify(
            result.answered
              ? `${e.name} 어르신 통화를 마쳤습니다. 요약이 저장되었습니다.`
              : `${e.name} 어르신이 전화를 받지 않았습니다.`
          );
          loadObservations(); // 방금 통화가 통화 기록 카드에 바로 보이도록 갱신합니다.
          return result;
        } catch (error) {
          e.contactStatus = previous;
          notify(`${e.name} 어르신 · ${error.message}`, { error: true });
          throw error;
        } finally {
          renderElders();
        }
      }

      $("#elders").addEventListener("click", (event) => {
        const callButton = event.target.closest('[data-action="call"]');
        if (callButton) {
          event.stopPropagation();
          startCall(callButton.dataset.id);
        }
      });

      (async () => {
        await loadRisk(); // 어르신 행의 위험도 칩이 이 값을 쓰므로 먼저 받습니다.
        loadElders();
        loadObservations();
        $("#src").textContent = `데이터 · ${API_BASE}`;
      })();
    </script>
  </body>
</html>
